<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Fixtures</title>
<link rel="stylesheet" href="../index.css">
<link rel="stylesheet" href="assets/host.css">
<script src="assets/host.js"></script>

<body>
<!--
  Table layout fixtures for tests/run.mjs. Open directly in a browser to eyeball.
  Per-table expectations read by the test:
    data-fit-from   viewport width (px) at and above which the table must not scroll
    data-max-lines  most lines any body cell may wrap to, at every viewport
                    (#prose allows 11: at 320px a sentence-long cell beats sideways-scrolling prose)
-->
<header class="host-bar">
  <h1>wp-block-styles</h1>
  <nav>
    <a href="index.html">All blocks</a>
    <a href="tables.html" aria-current="page">Tables</a>
  </nav>
  <div class="host-toggle" role="group" aria-label="Color scheme"></div>
</header>

<p class="host-intro">Table layout edge cases. Each table declares the viewport width it must fit from and how many lines a cell may wrap to; <code>npm test</code> checks both.</p>

<main class="host-section">
<div class="wp-content">

<figure class="wp-block-table" id="comparison" data-fit-from="768" data-max-lines="5">
  <table class="has-fixed-layout">
    <thead><tr><th>Annual, sample city</th><th>All library branches (city estimate)</th><th>Downtown branch (survey estimate)</th><th>Downtown branch, high-end estimate (all walk-in visits counted)</th></tr></thead>
    <tbody>
      <tr><td>Residents served</td><td>about 330,000 (all residents)</td><td>about 11,000 (adult card holders in range)</td><td>about 11,000 (adult card holders in range)</td></tr>
      <tr><td>Visits</td><td>9.9 million</td><td>about 730,000</td><td>about 1.9 million</td></tr>
      <tr><td>Visits per resident served</td><td>about 30</td><td>about 66</td><td>about 172</td></tr>
      <tr><td>Events hosted</td><td>about 5,300</td><td>about 210</td><td>not estimated</td></tr>
    </tbody>
  </table>
  <figcaption class="wp-element-caption">Comparison: long headers, short values</figcaption>
</figure>

<figure class="wp-block-table is-style-stripes" id="seven-col" data-fit-from="1024" data-max-lines="3">
  <table class="has-fixed-layout">
    <thead><tr><th>Plan</th><th>File storage</th><th>Team seats</th><th>Domains</th><th>API access</th><th>Support channel</th><th>Notes</th></tr></thead>
    <tbody>
      <tr><td>Starter</td><td>5 GB</td><td>1</td><td>Not included</td><td>No</td><td>Community forum only</td><td>Personal projects only, monthly billing</td></tr>
      <tr><td>Business</td><td>50 GB</td><td>Up to five users</td><td>Not included</td><td>No</td><td>Email within two days</td><td>Annual only</td></tr>
      <tr><td>Enterprise</td><td>1 TB</td><td>Unlimited</td><td>Included</td><td>Yes</td><td>Dedicated</td><td>Service agreements must be signed</td></tr>
    </tbody>
  </table>
  <figcaption class="wp-element-caption">Seven columns, stripes</figcaption>
</figure>

<figure class="wp-block-table" id="prose" data-fit-from="320" data-max-lines="11">

    <thead><tr><th>Release</th><th>Year</th><th>Summary</th></tr></thead>

      <tr><td>Version two</td><td>2017</td><td>Rewrote the rendering pipeline to support incremental updates after profiling slow pages, using a scheduler that accounts for the ratio of idle to busy frames observed in real-world performance data.</td></tr>

    </tbody>

<figure class="wp-block-table" id="long-words" data-fit-from="390" data-max-lines="3">

      <tr><td>Pen set</td><td class="has-text-align-center" data-align="center">Yes</td><td class="has-text-align-right" data-align="right">11,631</td><td class="has-text-align-right" data-align="right">12.75</td></tr>

  </table>

</figure>

<figure class="wp-block-table" id="colored-dark" data-fit-from="768" data-max-lines="3">
